[package]
name = "reconarya"
version = "0.1.0"
description = "Personal bug-bounty recon desktop app"
edition = "2021"

[lib]
name = "recon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# tokio is added in Phase 3 (scheduler).